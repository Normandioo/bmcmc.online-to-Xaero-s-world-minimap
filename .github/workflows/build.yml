# Builds the Xaero's mod and the server plugin on every push, and keeps the jars to download
# (repository > Actions > the run > Artifacts). Nothing needs to be installed on anyone's computer.
name: Build

on:
  push:
    branches: [claude/dev, claude/mc-26.2, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  mod:
    name: Fabric mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # The mod is compiled against Xaero's World Map and Minimap (they are not part of the repository and are not put in the jar):
      # the newest Fabric build of each for the Minecraft version in gradle.properties, from Modrinth.
      - name: Fetch Xaero's jars (compile only)
        run: |
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          mkdir -p libs
          for project in xaeros-world-map xaeros-minimap; do
            url=$(curl -fsS "https://api.modrinth.com/v2/project/$project/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22$mc%22%5D" \
              | python3 -c "import json,sys; v=json.load(sys.stdin); print(v[0]['files'][0]['url'])")
            echo "$project: $url"
            curl -fsSL -o "libs/$project.jar" "$url"
          done
      - run: chmod +x gradlew
      - name: Build
        shell: bash
        run: |
          set +e
          ./gradlew build --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=Gradle failed::$(grep -E 'error:|What went wrong' -A2 build.log | grep -v '^--' | cut -c1-230 | sed 's#.*territories/##' | head -400 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          cat build.log
          exit $code
      - name: Probe (temporary)
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/xwm && (cd /tmp/xwm && unzip -qo "$GITHUB_WORKSPACE/libs/xaeros-world-map.jar")
          mj=$(find ~/.gradle -name 'minecraft-*.jar' -path '*loom*' | grep -v sources | head -1)
          fj=$(find ~/.gradle -name 'fabric-screen-api-v1*.jar' | head -1)
          cj=$(find ~/.gradle -name 'fabric-command-api-v2*.jar' | head -1)
          note() { echo "::notice title=Probe $1::$(head -c 3500 /tmp/p.txt | cut -c1-220 | sed ':a;N;$!ba;s/\n/%0A/g')"; }
          javap -p -cp "$mj" net.minecraft.client.gui.GuiGraphicsExtractor 2>&1 | grep -E 'fill|text|String|item|blit|pose|Pose|scissor' | grep public > /tmp/p.txt; note GFX
          javap -p -cp /tmp/xwm xaero.map.element.MapElementGraphics 2>&1 | grep public > /tmp/p.txt; note MEG
          javap -p -cp /tmp/xwm xaero.map.gui.GuiMap 2>&1 | grep -iE 'mouse|click|drag' | grep -v 'private int\|private double\|private long' > /tmp/p.txt; note MAP
          javap -p -cp "$mj" net.minecraft.client.gui.screens.Screen 2>&1 | grep -iE 'mouse|click|drag' > /tmp/p.txt; note SCREEN
          javap -p -cp "$fj" net.fabricmc.fabric.api.client.screen.v1.ScreenMouseEvents 2>&1 > /tmp/p.txt; note SME
          javap -p -cp "$fj" 'net.fabricmc.fabric.api.client.screen.v1.ScreenMouseEvents$AllowMouseClick' 2>&1 > /tmp/p.txt; note SMEclick
          javap -p -cp "$mj" net.minecraft.client.MouseHandler 2>&1 | grep -iE 'Pressed|public' | head -30 > /tmp/p.txt; note MH
          javap -p -cp "$cj" net.fabricmc.fabric.api.client.command.v2.ClientCommands 2>&1 > /tmp/p.txt; note CMD
          javap -p -cp /tmp/xwm xaero.map.element.render.ElementRenderer 2>&1 | grep -E 'abstract' | sed 's/xaero\.map\.element\.render\.//g;s/xaero\.map\.graphics\.renderer\.multitexture\.//g;s/xaero\.map\.element\.//g' > /tmp/p.txt; note ER
      - uses: actions/upload-artifact@v4
        with:
          name: cumania-territories
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

  plugin:
    name: Server plugin (BmcWar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build
        shell: bash
        run: |
          set +e
          ./gradlew build --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # show the cause in the run's annotations too
            echo "::error title=Gradle failed::$(grep -E 'error|Could not|What went wrong|wrong|FAILED' -A3 build.log | head -25 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          cat build.log
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: BmcWar
          path: plugin/build/libs/*.jar

  # Publishes a Release with the two jars. It runs on a pushed tag "vX.Y.Z", and also on a push to main when mod_version
  # (gradle.properties) has no release yet: it then creates the tag itself. Notes: .github/release-notes/vX.Y.Z.md when it exists.
  release:
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [mod, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create the release (if this version has none)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already has a release"; exit 0; fi
          find dist -name '*.jar' | sort
          notes=".github/release-notes/$tag.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$tag" --title "$tag" --target "$GITHUB_SHA" "${notes_args[@]}" $(find dist -name '*.jar' | tr '\n' ' ')
