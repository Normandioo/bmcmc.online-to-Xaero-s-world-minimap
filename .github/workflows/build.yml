# Builds the Xaero's mod and the server plugin on every push, and keeps the jars to download
# (repository > Actions > the run > Artifacts). Nothing needs to be installed on anyone's computer.
name: Build

on:
  push:
    branches: [claude/dev, claude/mc-26.2, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  mod:
    name: Fabric mod ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '26.2', ship: true }
          - { mc: '26.3', ship: false }   # compile check only: the same jar must build against it too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          set +e
          mc="${{ matrix.mc }}"
          mkdir -p libs
          # compiled against Xaero's World Map and Minimap and the Fabric API of that Minecraft version (looked up on Modrinth; not part of the jar)
          for project in xaeros-world-map xaeros-minimap; do
            url=$(curl -fsS "https://api.modrinth.com/v2/project/$project/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22$mc%22%5D" | python3 -c "import json,sys; v=json.load(sys.stdin); print(v[0]['files'][0]['url'])" 2>/dev/null)
            if [ -z "$url" ]; then echo "::error title=No $project for $mc::no Fabric build on Modrinth"; exit 1; fi
            curl -fsSL -o "libs/$project.jar" "$url"
            unzip -j -o -q "libs/$project.jar" "META-INF/jars/*.jar" -d libs || true
          done
          api=$(curl -fsS "https://api.modrinth.com/v2/project/fabric-api/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22$mc%22%5D" | python3 -c "import json,sys; v=json.load(sys.stdin); print(v[0]['version_number'])" 2>/dev/null)
          if [ -z "$api" ]; then echo "::error title=No Fabric API for $mc::none on Modrinth"; exit 1; fi
          echo "fabric api $api"
          chmod +x gradlew
          ./gradlew build --no-daemon -Pminecraft_version=$mc -Pfabric_api_version=$api "-Pmc_range=>=26.1 <26.4" -Pjar_tag=mc26.x > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=Gradle failed on $mc::$(grep -E 'error:|What went wrong' -A2 build.log | grep -v '^--' | cut -c1-230 | sed 's#.*territories/##' | head -200 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          cat build.log | tail -5
          exit $code
      - uses: actions/upload-artifact@v4
        if: matrix.ship
        with:
          name: cumania-territories
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

  # The one jar also has to run on 26.1, which this build cannot compile against (Xaero's 26.1 API still uses Minecraft's MultiBufferSource): check that
  # the methods Xaero's 26.1 expects of a renderer are in the jar, and that what the mixins aim at is in Xaero's 26.1.
  verify-26-1:
    name: Check Xaero 26.1.2 against the jar
    needs: mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: cumania-territories
          path: jar
      - name: Check
        shell: bash
        run: |
          mc=26.1.2; mkdir -p w
          url=$(curl -fsS "https://api.modrinth.com/v2/project/xaeros-world-map/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22$mc%22%5D" | python3 -c "import json,sys; v=json.load(sys.stdin); print(v[0]['files'][0]['url'])")
          curl -fsSL -o xwm.jar "$url"; (cd w && unzip -qo ../xwm.jar)
          jar=$(ls jar/*.jar | head -1); echo "jar: $jar"
          fail=0
          javap -p -cp w xaero.map.element.render.ElementRenderer | grep abstract | grep MultiBufferSource > want.txt
          cat want.txt
          for c in LocalityRenderer PlayerRenderer WarMarkerRenderer; do
            javap -p -cp "$jar" "com.cumania.territories.compat.$c" > have.txt
            for m in preRender postRender renderElementShadow renderElement; do
              grep -q " $m(" have.txt || { echo "::error title=26.1::$c has no $m"; fail=1; }
            done
            # the 26.1 signatures, with the element as Object (what the generic erases to)
            n=$(grep -c 'MultiBufferSource\$BufferSource' have.txt); [ "$n" -ge 4 ] || { echo "::error title=26.1::$c declares only $n methods with MultiBufferSource"; fail=1; }
            grep -q 'renderElement(java.lang.Object, boolean, double, float, double, double, xaero.map.element.render.ElementRenderInfo, xaero.map.element.MapElementGraphics, net.minecraft.client.renderer.MultiBufferSource\$BufferSource' have.txt || { echo "::error title=26.1::$c: renderElement(Object, ...MultiBufferSource) is missing"; fail=1; }
          done
          for f in cameraDestination destScale mouseBlockPosX mouseBlockPosZ viewedOnMousePress; do
            javap -p -cp w xaero.map.gui.GuiMap | grep -q " $f;" || { echo "::error title=26.1::GuiMap.$f is missing"; fail=1; }
          done
          javap -p -cp w xaero.map.gui.GuiMap | grep -q "mapClicked(int, int, int)" || { echo "::error title=26.1::GuiMap.mapClicked is missing"; fail=1; }
          exit $fail

  plugin:
    name: Server plugin (BmcWar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build
        shell: bash
        run: |
          set +e
          ./gradlew build --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # show the cause in the run's annotations too
            echo "::error title=Gradle failed::$(grep -E 'error|Could not|What went wrong|wrong|FAILED' -A3 build.log | head -25 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          cat build.log
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: BmcWar
          path: plugin/build/libs/*.jar

  # Publishes a Release with the two jars. It runs on a pushed tag "vX.Y.Z", and also on a push to main when mod_version
  # (gradle.properties) has no release yet: it then creates the tag itself. Notes: .github/release-notes/vX.Y.Z.md when it exists.
  release:
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/mc-26.2' || startsWith(github.ref, 'refs/tags/v'))
    needs: [mod, plugin, verify-26-1]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create the release (if this version has none)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already has a release"; exit 0; fi
          find dist -name '*.jar' | sort
          notes=".github/release-notes/$tag.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          base="${tag#v}"; base="${base%%+*}"; mcv="${tag#*+mc}"
          if [ "$mcv" = "$tag" ] || [ "$mcv" = "26.x" ]; then mcv="26.1 - 26.3"; fi
          gh release create "$tag" --title "Cumania Territories $base for Minecraft $mcv" --target "$GITHUB_SHA" "${notes_args[@]}" $(find dist -name '*.jar' | tr '\n' ' ')
      - name: Upload to Modrinth (so launchers update the mod)
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/modrinth.sh
