plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = 'com.cumania'
base { archivesName = 'cumania-territories-' + (project.hasProperty('jar_tag') ? project.property('jar_tag') : 'mc' + project.minecraft_version) }

repositories {
    // Xaero's World Map and Minimap are compiled against from ./libs (put their jars there), so no repository is needed
}

// Xaero's World Map 26.1 still hands its renderers Minecraft's MultiBufferSource.BufferSource, which 26.2 renamed. The renderers declare the methods for
// both, so this stub gives the compiler the old type; it is only compiled against and never goes into the jar.
sourceSets { stub }

dependencies {
    compileOnly sourceSets.stub.output
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Xaero's, only to compile against; players install the real mods
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mc_range', project.mc_range
    filesMatching('fabric.mod.json') { expand 'version': project.version, 'mc_range': project.mc_range }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
