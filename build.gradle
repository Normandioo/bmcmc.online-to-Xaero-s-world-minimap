plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = 'com.cumania'
base { archivesName = 'cumania-territories-mc' + project.minecraft_version }

repositories {
    // Xaero's World Map and Minimap are compiled against from ./libs (put their jars there), so no repository is needed
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Xaero's, only to compile against; players install the real mods
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

// Xaero's 26.1 builds still use Minecraft's MultiBufferSource in their renderer API; 26.2 and later use their own XaeroBufferProvider.
// The sources are written for the new one; for 26.1 they are copied with that one type swapped.
def oldXaero = project.hasProperty('old_xaero') && project.property('old_xaero') == 'true'
if (oldXaero) {
    def gen = layout.buildDirectory.dir('generated-src')
    tasks.register('swapXaeroBuffer', Copy) {
        from('src/main/java')
        into(gen)
        filter { String line ->
            line.replace('import xaero.lib.client.graphics.XaeroBufferProvider;', 'import net.minecraft.client.renderer.MultiBufferSource;')
                .replace('XaeroBufferProvider', 'MultiBufferSource.BufferSource')
        }
    }
    sourceSets.main.java.setSrcDirs([gen])
    tasks.matching { it.name == 'compileJava' || it.name == 'sourcesJar' }.configureEach { dependsOn 'swapXaeroBuffer' }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mc_range', project.mc_range
    filesMatching('fabric.mod.json') { expand 'version': project.version, 'mc_range': project.mc_range }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
