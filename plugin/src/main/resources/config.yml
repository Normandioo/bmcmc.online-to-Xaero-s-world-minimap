# BmcWar - wars by the clock. Everything about cities, wars, sides and players comes from the site.

site:
  # The file the site publishes (cities with their land from the SVG, wars, who is in which country).
  url: https://bmcmc.online/gaia/territories.json
  refresh-minutes: 5

# The Minecraft world the wars are fought in, and the dynmap world its markers are in.
world: world
dynmap:
  world: world

# Which wars to run (their ids in the site's diplomacy.json). Empty = every war marked "live": true that has not ended.
wars: []

capture:
  # How long (minutes) a side must stay inside a city's land to take it, by the city's type.
  # THESE ARE PLACEHOLDERS: set the times your rules call for.
  minutes:
    Locality: 10
    Colonial: 15
    Fort: 15
    Small: 20
    Medium: 30
    Large: 45
  default-minutes: 10
  # A capital takes this many times as long as its type says.
  capital-multiplier: 1.5
  # Someone of the side that holds the city inside it is resistance: the city shows as contested.
  # reset = the time starts over when the resistance ends, pause = it keeps what it had.
  on-resistance: reset
  # Seconds the attackers may be out of the city before the attempt is dropped.
  grace-seconds: 60
  # Minutes after a city is taken during which it cannot be taken again.
  cooldown-minutes: 10
  # Players of a side that must be inside for the time to run.
  min-attackers: 1
  # A city with no outline on the site gets a round area of this radius (blocks).
  fallback-radius: 40

announce:
  start: true
  contested: true
  captured: true
  aborted: false
  # Show the time left above the hotbar to the players inside the city.
  actionbar: true
